<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Examen C - 26004956</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0066cc">
    
    <style>
        :root {
            --bg-principal: #f4f7f6;
            --bg-contenedor: #ffffff;
            --texto-principal: #2c3e50;
            --color-primario: #0066cc;
            --color-borde: #dddddd;
        }
        [data-theme="dark"] {
            --bg-principal: #121212;
            --bg-contenedor: #1e1e1e;
            --texto-principal: #f5f5f5;
            --color-primario: #3788d8;
            --color-borde: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-principal); 
            color: var(--texto-principal); 
            padding: 15px;
            /* Evita el scroll horizontal */
            overflow-x: hidden; 
        }

        header { 
            text-align: center;
            padding: 10px; 
            border-bottom: 2px solid var(--color-primario);
            margin-bottom: 20px;
        }

        /* DISEÑO DE APP: Una sola columna vertical por defecto */
        main { 
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 100%;
        }

        .contenedor-seccion { 
            background-color: var(--bg-contenedor); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
        }

        h2 { font-size: 1.2rem; color: var(--color-primario); margin-bottom: 15px; }

        button { 
            width: 100%; /* Botones grandes fáciles de tocar en móvil */
            padding: 15px; 
            background-color: var(--color-primario); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold;
            margin-top: 10px;
        }

        img, .logo-galileo { max-width: 100%; height: auto; }
        
        canvas { 
            background-color: #222; 
            width: 100%; /* Ajusta el canvas al ancho del celular */
            height: auto;
            border-radius: 8px;
        }

        /* Solo si la pantalla es de computadora, ponemos dos columnas */
        @media (min-width: 1024px) {
            main {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
            header, footer { grid-column: span 2; }
        }
    </style>
</head>
