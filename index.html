        :root {
            --bg-principal: #f4f7f6;
            --bg-contenedor: #ffffff;
            --texto-principal: #2c3e50;
            --texto-secundario: #555555;
            --color-primario: #0066cc;
            --color-primario-hover: #004499;
            --color-borde: #dddddd;
            --color-alerta: #e74c3c;
        }
        [data-theme="dark"] {
            --bg-principal: #121212;
            --bg-contenedor: #1e1e1e;
            --texto-principal: #f5f5f5;
            --texto-secundario: #b0b0b0;
            --color-primario: #3788d8;
            --color-primario-hover: #519ce8;
            --color-borde: #333333;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            transition: background-color 0.3s ease; 
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-principal); 
            color: var(--texto-principal); 
            padding: 15px; 
            overflow-x: hidden; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            max-width: 500px; 
            margin: 0 auto 20px auto; 
            padding: 10px 5px; 
            border-bottom: 2px solid var(--color-primario); 
        }

        header h1 {
            font-size: 1.3rem;
        }

        /* Fuerza una sola columna vertical rígida de bloques */
        main { 
            max-width: 500px; 
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            gap: 20px; 
        }

        .contenedor-seccion { 
            background-color: var(--bg-contenedor); 
            border: 1px solid var(--color-borde); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            width: 100%;
        }

        h2 { 
            color: var(--color-primario); 
            margin-bottom: 15px; 
            border-bottom: 1px solid var(--color-borde); 
            padding-bottom: 5px; 
            font-size: 1.25rem;
        }

        /* Botones de bloque completo estilo móvil */
        button { 
            width: 100%;
            background-color: var(--color-primario); 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 1rem; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 10px; 
            font-weight: 600; 
        }
